name: Fork Release

# Lightweight release workflow for the sun-praise/deepseek-reasonix fork.
# It builds the reasonix binary for the platforms our install script supports
# and uploads them to the GitHub release created by the tag push.
#
# The upstream release.yml is gated on a protected environment and R2 secrets;
# this workflow is intentionally simple and works with only GITHUB_TOKEN.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.17.13)'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'sun-praise/deepseek-reasonix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ -z "$tag" ]]; then
            echo "::error::could not determine tag"
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"

      - name: Build release archives
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos="$1"
            local goarch="$2"
            local bin="reasonix"
            local ext="tar.gz"
            if [[ "$goos" == "windows" ]]; then
              bin="reasonix.exe"
              ext="zip"
            fi
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.version=${TAG}" \
              -o "dist/${bin}" ./cmd/reasonix
            if [[ "$goos" == "windows" ]]; then
              (cd dist && zip "reasonix-${goos}-${goarch}.zip" "${bin}")
            else
              (cd dist && tar -czf "reasonix-${goos}-${goarch}.tar.gz" "${bin}")
            fi
            rm -f "dist/${bin}" "dist/${bin}.exe"
          }
          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64
          build windows arm64

      - name: Generate SHA256SUMS
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          echo "### Release assets for ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create or upload release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Reasonix CLI ${TAG}" \
              --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: Smoke test released binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p smoke
          gh release download "$TAG" -p 'reasonix-linux-amd64.tar.gz' -D smoke
          tar -xzf smoke/reasonix-linux-amd64.tar.gz -C smoke
          smoke/reasonix --version
          smoke/reasonix multi-review --help
